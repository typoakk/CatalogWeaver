name: Versioned release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: catalogweaver_release_test
          POSTGRES_USER: catalogweaver_test
          POSTGRES_PASSWORD: isolated-release-tests
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U catalogweaver_test -d catalogweaver_release_test" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Verify version and test
        env:
          MEDIA_IMPORTER_TEST_CONNECTION: Host=127.0.0.1;Database=catalogweaver_release_test;Username=catalogweaver_test;Password=isolated-release-tests
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(dotnet msbuild src/MediaImporter/MediaImporter.csproj -getProperty:Version)" = "$version"
          dotnet test tests/MediaImporter.Tests/MediaImporter.Tests.csproj -c Release -r linux-x64
          python3 tests/operations_test.py
      - name: Build and publish versioned image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image:$version" >/dev/null 2>&1; then echo 'This version already has an image; use a new version.' >&2; exit 1; fi
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$version" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image:$version" -t "$image:sha-$GITHUB_SHA" .
          CATALOGWEAVER_IMAGE="$image:$version" bash tests/operations-smoke.sh
          docker push "$image:$version"
          docker push "$image:sha-$GITHUB_SHA"
          docker inspect --format='{{index .RepoDigests 0}}' "$image:$version" > image-digest.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" image-digest.txt --verify-tag --title "CatalogWeaver $GITHUB_REF_NAME" --notes-file CHANGELOG.md
